name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.1.0"

      - name: Configure Bubblewrap environment
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK_PATH"
          echo "JDK: $JAVA_HOME"

          test -d "$SDK_PATH"
          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platforms"

          if [ ! -e "$SDK_PATH/bin" ]; then
            SDKMANAGER_DIR="$(dirname "$(find "$SDK_PATH" -type f -name sdkmanager | head -n 1)")"
            echo "SDK Manager directory: $SDKMANAGER_DIR"
            ln -s "$SDKMANAGER_DIR" "$SDK_PATH/bin"
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

      - name: Create TWA configuration
        run: |
          mkdir -p android-app
          cat > android-app/twa-manifest.json <<'EOF'
          {
            "packageId": "com.esports.tournaments.user",
            "host": "s81987269-star.github.io",
            "name": "ESPORTS TOURNAMENTS",
            "launcherName": "ESPORTS",
            "display": "standalone",
            "themeColor": "#050B14",
            "themeColorDark": "#050B14",
            "navigationColor": "#050B14",
            "navigationColorDark": "#050B14",
            "backgroundColor": "#050B14",
            "enableNotifications": true,
            "startUrl": "/esports-tournaments-user/",
            "iconUrl": "https://s81987269-star.github.io/esports-tournaments-user/file_00000000a58482089674c4e29ff14b34.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionCode": 2,
            "appVersion": "1.3.2",
            "webManifestUrl": "https://s81987269-star.github.io/esports-tournaments-user/manifest.json",
            "minSdkVersion": 21,
            "orientation": "default"
          }
          EOF

      - name: Generate Android project
        working-directory: android-app
        run: bubblewrap update --skipVersionUpgrade

      - name: Restore signing keystore
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Build APK
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esports-tournaments-apk
          path: android-app/app-release-signed.apk
