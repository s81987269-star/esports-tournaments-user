name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap and Android SDK
        run: |
          npm install -g @bubblewrap/cli
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate Firebase config
        shell: bash
        run: |
          set -euo pipefail
          test -f google-services.json
          python3 - <<'PY'
          import json
          d=json.load(open('google-services.json'))
          project=d.get('project_info',{}).get('project_id')
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in d.get('client',[])]
          print('Firebase project:',project)
          print('Android packages:',packages)
          assert project == 'esports-tournaments-c6628', 'Wrong Firebase project ID'
          assert 'com.esports.tournaments.user' in packages, 'Expected Android package missing'
          PY

      - name: Prepare Bubblewrap project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app
          if [ ! -f android-app/twa-manifest.json ]; then
            cat > android-app/twa-manifest.json <<'JSON'
          {
            "packageId": "com.esports.tournaments.user",
            "host": "s81987269-star.github.io",
            "name": "ESPORTS TOURNAMENTS",
            "launcherName": "ESPORTS",
            "display": "standalone",
            "themeColor": "#080B12",
            "navigationColor": "#080B12",
            "navigationColorDark": "#080B12",
            "backgroundColor": "#080B12",
            "enableNotifications": true,
            "startUrl": "/esports-tournaments-user/",
            "webManifestUrl": "https://s81987269-star.github.io/esports-tournaments-user/manifest.json",
            "fallbackType": "customtabs",
            "orientation": "portrait",
            "appVersionName": "1.3.3",
            "appVersionCode": 3,
            "signingKey": {"path": "android.keystore", "alias": "android"},
            "fingerprints": []
          }
          JSON
          fi
          cd android-app
          if [ ! -f package.json ]; then npm init -y; fi
          if [ ! -f twa-manifest.json ]; then
            bubblewrap init --manifest https://s81987269-star.github.io/esports-tournaments-user/manifest.json --directory .
          fi
          bubblewrap update --skipVersionUpgrade

      - name: Add Firebase FCM registration and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          APP=android-app/app
          cp google-services.json "$APP/google-services.json"
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('android-app/app')
          gradle=app/'build.gradle'
          if not gradle.exists():
              raise SystemExit('Missing android-app/app/build.gradle')

          s=gradle.read_text()

          if 'com.google.gms.google-services' not in s:
              if re.search(r'plugins\s*\{',s):
                  s=re.sub(
                      r'plugins\s*\{',
                      'plugins {\n    id "com.google.gms.google-services"',
                      s,
                      count=1
                  )
              else:
                  s='apply plugin: "com.google.gms.google-services"\n'+s

          deps=[
            'implementation platform("com.google.firebase:firebase-bom:33.7.0")',
            'implementation "com.google.firebase:firebase-messaging"',
            'implementation "com.google.firebase:firebase-auth"',
            'implementation "com.google.firebase:firebase-firestore"',
            'implementation "androidx.core:core:1.13.1"'
          ]

          for dep in deps:
              artifact=dep.split('"')[1]
              if artifact not in s:
                  if re.search(r'dependencies\s*\{',s):
                      s=re.sub(
                          r'dependencies\s*\{',
                          'dependencies {\n    '+dep,
                          s,
                          count=1
                      )
                  else:
                      s+='\n\ndependencies {\n    '+dep+'\n}\n'

          gradle.write_text(s)

          src=app/'src/main/java/com/esports/tournaments/user'
          src.mkdir(parents=True,exist_ok=True)

          (src/'NativeFcmRegistrar.java').write_text(r'''package com.esports.tournaments.user;

          import android.util.Log;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.firestore.FirebaseFirestore;
          import com.google.firebase.messaging.FirebaseMessaging;
          import java.util.HashMap;
          import java.util.Map;

          public final class NativeFcmRegistrar {
              private static final String TAG = "ESPORTS_FCM";

              private NativeFcmRegistrar() {}

              public static void register(String source) {
                  Log.i(TAG, "Registration requested from " + source);

                  FirebaseAuth auth = FirebaseAuth.getInstance();

                  if (auth.getCurrentUser() != null) {
                      fetchAndSave(source);
                      return;
                  }

                  auth.signInAnonymously()
                      .addOnSuccessListener(result -> {
                          Log.i(TAG, "Anonymous auth success; uid=" + result.getUser().getUid());
                          fetchAndSave(source);
                      })
                      .addOnFailureListener(e ->
                          Log.e(TAG, "Anonymous auth FAILED", e));
              }

              private static void fetchAndSave(String source) {
                  FirebaseAuth auth = FirebaseAuth.getInstance();

                  if (auth.getCurrentUser() == null) {
                      Log.e(TAG, "No Firebase user after auth");
                      return;
                  }

                  String uid = auth.getCurrentUser().getUid();

                  FirebaseMessaging.getInstance().getToken()
                      .addOnSuccessListener(token -> {
                          if (token == null || token.trim().isEmpty()) {
                              Log.e(TAG, "Empty FCM token");
                              return;
                          }

                          Map<String,Object> data = new HashMap<>();
                          data.put("uid", uid);
                          data.put("token", token);
                          data.put("type", "android_native");
                          data.put("enabled", true);
                          data.put("packageName", "com.esports.tournaments.user");
                          data.put("source", source);
                          data.put("updatedAt", System.currentTimeMillis());

                          FirebaseFirestore.getInstance()
                              .collection("native_devices")
                              .document(uid)
                              .set(data)
                              .addOnSuccessListener(v ->
                                  Log.i(TAG, "SUCCESS native_devices/" + uid))
                              .addOnFailureListener(e ->
                                  Log.e(TAG, "Firestore native_devices write FAILED", e));

                          Map<String,Object> status = new HashMap<>();
                          status.put("nativeFcmDiagnostic", "token_obtained_firestore_write_started");
                          status.put("nativeFcmDiagnosticAt", System.currentTimeMillis());
                          status.put(
                              "nativeFcmTokenSuffix",
                              token.substring(Math.max(0,token.length()-8))
                          );

                          FirebaseFirestore.getInstance()
                              .collection("users")
                              .document(uid)
                              .set(
                                  status,
                                  com.google.firebase.firestore.SetOptions.merge()
                              )
                              .addOnSuccessListener(v ->
                                  Log.i(TAG, "Diagnostic saved to users/" + uid))
                              .addOnFailureListener(e ->
                                  Log.e(TAG, "Diagnostic users write FAILED", e));
                      })
                      .addOnFailureListener(e ->
                          Log.e(TAG, "FCM getToken FAILED", e));
              }
          }'''.replace('\n          ', '\n'))

          (src/'EsportsApplication.java').write_text('''package com.esports.tournaments.user;
          import android.app.Application;
          import android.util.Log;
          import com.google.firebase.FirebaseApp;

          public class EsportsApplication extends Application {
              @Override public void onCreate() {
                  super.onCreate();
                  try {
                      FirebaseApp.initializeApp(this);
                      Log.i("ESPORTS_FCM", "Application started");
                      NativeFcmRegistrar.register("application_onCreate");
                  } catch (Exception e) {
                      Log.e("ESPORTS_FCM", "Application startup failed", e);
                  }
              }
          }'''.replace('\n          ', '\n')+'\n')

          (src/'EsportsFirebaseMessagingService.java').write_text('''package com.esports.tournaments.user;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class EsportsFirebaseMessagingService extends FirebaseMessagingService {
              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);
                  NativeFcmRegistrar.register("messaging_onNewToken");
              }

              @Override
              public void onMessageReceived(RemoteMessage m) {
                  super.onMessageReceived(m);

                  String title = m.getNotification() != null
                      ? m.getNotification().getTitle() : "ESPORTS TOURNAMENTS";
                  String body = m.getNotification() != null
                      ? m.getNotification().getBody() : "You have a new update.";

                  NotificationManager nm =
                      (NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);

                  String channel = "esports_native_updates";

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          new NotificationChannel(
                              channel,
                              "ESPORTS Updates",
                              NotificationManager.IMPORTANCE_DEFAULT
                          )
                      );
                  }

                  Intent launch =
                      getPackageManager().getLaunchIntentForPackage(getPackageName());

                  PendingIntent pi = null;

                  if (launch != null) {
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) {
                          flags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      pi = PendingIntent.getActivity(this, 0, launch, flags);
                  }

                  NotificationCompat.Builder b =
                      new NotificationCompat.Builder(this, channel)
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle(title == null ? "ESPORTS TOURNAMENTS" : title)
                          .setContentText(body == null ? "You have a new update." : body)
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                          .setAutoCancel(true);

                  if (pi != null) b.setContentIntent(pi);

                  NotificationManagerCompat.from(this)
                      .notify((int)System.currentTimeMillis(), b.build());
              }
          }'''.replace('\n          ', '\n')+'\n')

          manifest=app/'src/main/AndroidManifest.xml'

          if not manifest.exists():
              raise SystemExit('Missing AndroidManifest.xml')

          xml=manifest.read_text()
          m=re.search(r'<application\b[^>]*>',xml,re.S)

          if not m:
              raise SystemExit('No application element in manifest')

          tag=re.sub(r'\s+android:name="[^"]*"','',m.group(0))
          tag=tag[:-1]+' android:name=".EsportsApplication">'
          xml=xml[:m.start()]+tag+xml[m.end():]

          if 'android.permission.POST_NOTIFICATIONS' not in xml:
              end=xml.find('>')
              xml=xml[:end+1]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+xml[end+1:]

          if 'EsportsFirebaseMessagingService' not in xml:
              service='''\n        <service android:name=".EsportsFirebaseMessagingService" android:exported="false">\n            <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter>\n        </service>\n    '''
              xml=xml.replace('</application>',service+'</application>',1)

          manifest.write_text(xml)
          print('Native FCM registration and diagnostic status code added.')
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-app

          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname 'CN=ESPORTS TOURNAMENTS, OU=Mobile, O=ESPORTS, L=Delhi, ST=Delhi, C=IN'

            echo 'WARNING: this keystore is temporary unless you preserve it; future APK updates need the same signing key.'
          fi

          bubblewrap build --skipPwaValidation
          cd ..
          mkdir -p output

          APK=$(find android-app -type f -name '*signed*.apk' -print -quit)

          if [ -z "$APK" ]; then
            APK=$(find android-app -type f -name '*.apk' -print -quit)
          fi

          test -n "$APK"
          cp "$APK" output/ESPORTS-TOURNAMENTS-native-FCM-diagnostic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPORTS-TOURNAMENTS-native-FCM-diagnostic
          path: output/ESPORTS-TOURNAMENTS-native-FCM-diagnostic.apk
          if-no-files-found: error
