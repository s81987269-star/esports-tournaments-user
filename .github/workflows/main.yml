name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.1.0"

      - name: Configure Bubblewrap environment
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK_PATH"
          echo "JDK: $JAVA_HOME"

          test -d "$SDK_PATH"
          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platforms"

          if [ ! -e "$SDK_PATH/bin" ]; then
            SDKMANAGER_DIR="$(dirname "$(find "$SDK_PATH" -type f -name sdkmanager | head -n 1)")"
            echo "SDK Manager directory: $SDKMANAGER_DIR"
            ln -s "$SDKMANAGER_DIR" "$SDK_PATH/bin"
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

      - name: Create TWA configuration
        run: |
          mkdir -p android-app

          cat > android-app/twa-manifest.json <<'EOF'
          {
            "packageId": "com.esports.tournaments.user",
            "host": "s81987269-star.github.io",
            "name": "ESPORTS TOURNAMENTS",
            "launcherName": "ESPORTS",
            "display": "standalone",
            "themeColor": "#050B14",
            "themeColorDark": "#050B14",
            "navigationColor": "#050B14",
            "navigationColorDark": "#050B14",
            "backgroundColor": "#050B14",
            "enableNotifications": true,
            "startUrl": "/esports-tournaments-user/",
            "iconUrl": "https://s81987269-star.github.io/esports-tournaments-user/file_00000000a58482089674c4e29ff14b34.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionCode": 2,
            "appVersion": "1.3.2",
            "webManifestUrl": "https://s81987269-star.github.io/esports-tournaments-user/manifest.json",
            "minSdkVersion": 23,
            "orientation": "default"
          }
          EOF

      - name: Generate Android project
        working-directory: android-app
        run: bubblewrap update --skipVersionUpgrade

      - name: Add Firebase Android configuration
        run: |
          cp google-services.json android-app/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/app/build.gradle")
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s += '\napply plugin: "com.google.gms.google-services"\n'

          if "com.google.firebase:firebase-auth" not in s:
              s += '''
          
          dependencies {
              implementation "com.google.firebase:firebase-messaging:25.1.3"
              implementation "com.google.firebase:firebase-auth:24.2.0"
              implementation "com.google.firebase:firebase-firestore:26.6.0"
          }
          '''

          p.write_text(s)

          root = Path("android-app/build.gradle")
          s = root.read_text()

          if "com.google.gms:google-services" not in s:
              s = s.replace(
                  "dependencies {",
                  'dependencies {\n        classpath "com.google.gms:google-services:4.5.0"',
                  1
              )

          root.write_text(s)
          PY

      - name: Add native FCM service
        run: |
          mkdir -p android-app/app/src/main/java/com/esports/tournaments/user

          cat > android-app/app/src/main/java/com/esports/tournaments/user/EsportsFirebaseMessagingService.java <<'EOF'
          package com.esports.tournaments.user;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.firestore.FirebaseFirestore;
          import com.google.firebase.firestore.SetOptions;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.HashMap;
          import java.util.Map;

          public class EsportsFirebaseMessagingService extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "esports_notifications";

              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);

                  FirebaseAuth auth = FirebaseAuth.getInstance();

                  auth.signInAnonymously()
                          .addOnCompleteListener(task -> {

                              if (!task.isSuccessful()) {
                                  android.util.Log.e(
                                          "ESPORTS_FCM",
                                          "Anonymous authentication failed",
                                          task.getException()
                                  );
                                  return;
                              }

                              String uid =
                                      auth.getCurrentUser().getUid();

                              FirebaseFirestore db =
                                      FirebaseFirestore.getInstance();

                              Map<String, Object> data =
                                      new HashMap<>();

                              data.put("token", token);
                              data.put("type", "android_native");
                              data.put("enabled", true);
                              data.put("uid", uid);
                              data.put(
                                      "packageName",
                                      getPackageName()
                              );
                              data.put(
                                      "updatedAt",
                                      System.currentTimeMillis()
                              );

                              db.collection("native_devices")
                                      .document(uid)
                                      .set(data, SetOptions.merge())
                                      .addOnSuccessListener(unused ->
                                              android.util.Log.d(
                                                      "ESPORTS_FCM",
                                                      "Native FCM token saved"
                                              )
                                      )
                                      .addOnFailureListener(error ->
                                              android.util.Log.e(
                                                      "ESPORTS_FCM",
                                                      "Token save failed",
                                                      error
                                              )
                                      );
                          });
              }

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {

                  String title = "ESPORTS TOURNAMENTS";
                  String body = "You have a new notification.";

                  if (remoteMessage.getNotification() != null) {

                      if (remoteMessage.getNotification().getTitle() != null) {
                          title =
                                  remoteMessage
                                          .getNotification()
                                          .getTitle();
                      }

                      if (remoteMessage.getNotification().getBody() != null) {
                          body =
                                  remoteMessage
                                          .getNotification()
                                          .getBody();
                      }
                  }

                  if (remoteMessage.getData().containsKey("title")) {
                      title =
                              remoteMessage
                                      .getData()
                                      .get("title");
                  }

                  if (remoteMessage.getData().containsKey("message")) {
                      body =
                              remoteMessage
                                      .getData()
                                      .get("message");
                  }

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE
                                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "ESPORTS TOURNAMENTS",
                                      NotificationManager.IMPORTANCE_HIGH
                              );

                      manager.createNotificationChannel(channel);
                  }

                  Intent intent =
                          getPackageManager()
                                  .getLaunchIntentForPackage(
                                          getPackageName()
                                  );

                  if (intent == null) {
                      return;
                  }

                  intent.addFlags(
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                  );

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                                          ? PendingIntent.FLAG_IMMUTABLE
                                          : 0)
                          );

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(
                                  this,
                                  CHANNEL_ID
                          )
                          .setSmallIcon(
                                  android.R.drawable.ic_dialog_info
                          )
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(
                                  new NotificationCompat.BigTextStyle()
                                          .bigText(body)
                          )
                          .setPriority(
                                  NotificationCompat.PRIORITY_HIGH
                          )
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                  manager.notify(
                          (int) System.currentTimeMillis(),
                          builder.build()
                  );
              }
          }
          EOF

      - name: Add native FCM startup registration
        run: |
          mkdir -p android-app/app/src/main/java/com/esports/tournaments/user

          cat > android-app/app/src/main/java/com/esports/tournaments/user/EsportsApplication.java <<'EOF'
          package com.esports.tournaments.user;

          import android.app.Application;
          import android.util.Log;

          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.firestore.FirebaseFirestore;
          import com.google.firebase.firestore.SetOptions;
          import com.google.firebase.messaging.FirebaseMessaging;

          import java.util.HashMap;
          import java.util.Map;

          public class EsportsApplication extends Application {

              private static final String TAG = "ESPORTS_FCM";

              @Override
              public void onCreate() {
                  super.onCreate();

                  registerNativeFCMToken();
              }

              private void registerNativeFCMToken() {

                  FirebaseAuth auth =
                          FirebaseAuth.getInstance();

                  if (auth.getCurrentUser() == null) {

                      auth.signInAnonymously()
                              .addOnCompleteListener(task -> {

                                  if (!task.isSuccessful()) {
                                      Log.e(
                                              TAG,
                                              "Anonymous auth failed",
                                              task.getException()
                                      );
                                      return;
                                  }

                                  saveCurrentFCMToken();
                              });

                  } else {

                      saveCurrentFCMToken();
                  }
              }

              private void saveCurrentFCMToken() {

                  FirebaseMessaging
                          .getInstance()
                          .getToken()
                          .addOnCompleteListener(task -> {

                              if (!task.isSuccessful()) {

                                  Log.e(
                                          TAG,
                                          "FCM token retrieval failed",
                                          task.getException()
                                  );

                                  return;
                              }

                              String token = task.getResult();

                              FirebaseAuth auth =
                                      FirebaseAuth.getInstance();

                              if (auth.getCurrentUser() == null) {
                                  Log.e(
                                          TAG,
                                          "Firebase user is null"
                                  );
                                  return;
                              }

                              String uid =
                                      auth.getCurrentUser()
                                              .getUid();

                              Map<String, Object> data =
                                      new HashMap<>();

                              data.put(
                                      "token",
                                      token
                              );

                              data.put(
                                      "type",
                                      "android_native"
                              );

                              data.put(
                                      "enabled",
                                      true
                              );

                              data.put(
                                      "uid",
                                      uid
                              );

                              data.put(
                                      "packageName",
                                      getPackageName()
                              );

                              data.put(
                                      "updatedAt",
                                      System.currentTimeMillis()
                              );

                              FirebaseFirestore
                                      .getInstance()
                                      .collection(
                                              "native_devices"
                                      )
                                      .document(uid)
                                      .set(
                                              data,
                                              SetOptions.merge()
                                      )
                                      .addOnSuccessListener(
                                              unused ->
                                                      Log.d(
                                                              TAG,
                                                              "Current native FCM token saved"
                                                      )
                                      )
                                      .addOnFailureListener(
                                              error ->
                                                      Log.e(
                                                              TAG,
                                                              "Native FCM token save failed",
                                                              error
                                                      )
                                      );
                          });
              }
          }
          EOF

      - name: Register native FCM service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          service = '''
              <service
                  android:name=".EsportsFirebaseMessagingService"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
          '''

          if "EsportsFirebaseMessagingService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n    </application>"
              )

          import re

          def register_application(match):
              tag = match.group(0)

              tag = re.sub(
                  r'\s+android:name\s*=\s*["\'][^"\']*["\']',
                  '',
                  tag
              )

              return tag[:-1] + ' android:name=".EsportsApplication">'

          s, count = re.subn(
              r'<application\b[^>]*>',
              register_application,
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find application tag"
              )

          p.write_text(s)
          PY

      - name: Add notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(
                  "</manifest>",
                  permission + "\n</manifest>"
              )

          p.write_text(s)
          PY

      - name: Create signing keystore
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ESPORTS TOURNAMENTS, OU=ESPORTS, O=ESPORTS TOURNAMENTS, C=IN"

      - name: Build APK
        working-directory: android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Verify Native FCM Registration Setup
        run: |
          echo "Checking Android Firebase setup..."

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"
          APP="android-app/app/src/main/java/com/esports/tournaments/user/EsportsApplication.java"
          SERVICE="android-app/app/src/main/java/com/esports/tournaments/user/EsportsFirebaseMessagingService.java"
          GOOGLE="android-app/app/google-services.json"

          test -f "$MANIFEST" || { echo "ERROR: AndroidManifest.xml missing"; exit 1; }
          test -f "$APP" || { echo "ERROR: EsportsApplication.java missing"; exit 1; }
          test -f "$SERVICE" || { echo "ERROR: EsportsFirebaseMessagingService.java missing"; exit 1; }
          test -f "$GOOGLE" || { echo "ERROR: google-services.json missing"; exit 1; }

          grep -q 'android:name=".EsportsApplication"' "$MANIFEST" \
            && echo "OK: Application registered" \
            || { echo "ERROR: Application NOT registered"; exit 1; }

          grep -q 'EsportsFirebaseMessagingService' "$MANIFEST" \
            && echo "OK: FCM service registered" \
            || { echo "ERROR: FCM service NOT registered"; exit 1; }

          grep -q 'com.google.firebase:firebase-messaging' android-app/app/build.gradle \
            && echo "OK: Firebase Messaging dependency found" \
            || { echo "ERROR: Firebase Messaging dependency missing"; exit 1; }

          echo "Native FCM setup checks passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esports-tournaments-apk
          path: android-app/app-release-signed.apk
